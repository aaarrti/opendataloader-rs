[project]
name = "opendataloader-agents"
version = "0.1.0"
description = "OpenDataLoader function tools for the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["openai-agents>=0.3.0", "opendataloader==0.0.1.dev1"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
opendataloader = { workspace = true }
