[stg_regression]
test = "tests::stg_regression_matches_selected_oracles"
status = "active"
evidence = "STD1 runs exactly ten complete PDF/JSON/Markdown triplets, collects fixture-specific conversion, JSON, and Markdown failures, and compares all ten on every invocation."
blockers = [
    "lopdf text operands do not decode the embedded CJK font encodings used by the corpus",
    "the parser assigns page bounds instead of preserving text coordinates needed for semantic reconstruction",
    "image extraction and semantic element grouping do not yet match the Java oracle",
]

[STD2]
status = "complete"
test_command = "cargo test -p opendataloader_core --locked stg_regression_matches_selected_oracles -- --nocapture"
result = "All ten conversions completed; each fixture reported one JSON mismatch and one exact Markdown-byte mismatch. No conversion or oracle read failures occurred."
root_causes = [
    "Embedded subset-font encodings are decoded as control characters or mojibake by parser.rs, so source text differs before semantic reconstruction.",
    "parser.rs assigns page bounds to extracted text instead of source coordinates, causing cleanup.rs, semantics.rs, and reading_order.rs to lose geometry and fabricate grouping/table structure.",
    "Image and table chunk/semantic structure differs in parser.rs, images.rs, and semantics.rs; the current output has broad false tables and does not reproduce Java image/table nodes.",
]
fix_tasks = ["STD2-F1", "STD2-F2", "STD2-F3"]

